<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HEROINES LIVE">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>HEROINES LIVE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f7;
  color:#151518;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif
}

header{
  background:#111;
  color:white;
  padding:25px 16px 18px;
  position:sticky;
  top:0;
  z-index:5
}

.wrap{
  max-width:720px;
  margin:auto
}

h1{
  margin:0;
  font-size:25px;
  font-weight:900
}

.sub{
  font-size:12px;
  color:#aaa;
  margin-top:4px
}

input{
  width:100%;
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  border:1px solid #444;
  background:#242428;
  color:#fff
}

main{
  padding:14px
}

.filter-title{
  font-size:11px;
  color:#777;
  font-weight:800;
  margin:4px 2px
}

.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:7px
}

.f{
  border:0;
  background:#fff;
  padding:9px 14px;
  border-radius:999px;
  font-weight:800;
  white-space:nowrap
}

.on{
  background:#111!important;
  color:#fff
}

.month{
  font-size:14px;
  font-weight:900;
  margin:20px 2px 8px
}

.card{
  background:#fff;
  border-radius:17px;
  padding:15px;
  margin:9px 0;
  box-shadow:0 2px 10px #0001
}

.head{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.date{
  font-size:18px;
  font-weight:900
}

.dow{
  font-size:12px;
  color:#777
}

.badge{
  font-size:11px;
  padding:5px 8px;
  border-radius:8px;
  background:#eee;
  white-space:nowrap
}

.ok{
  background:#eee6ff;
  color:#6335b8
}

.group{
  font-size:16px;
  font-weight:900;
  margin-top:9px
}

.title{
  font-size:14px;
  margin-top:3px
}

.venue{
  font-size:13px;
  color:#555;
  margin:9px 0 12px
}

.tag{
  display:inline-block;
  font-size:10px;
  font-weight:800;
  background:#f0f0f2;
  border-radius:7px;
  padding:4px 7px;
  margin:0 4px 8px 0
}

.sources{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:4px
}

.source-btn{
  display:inline-block;
  text-align:center;
  text-decoration:none;
  background:#111;
  color:#fff;
  border-radius:10px;
  padding:9px 11px;
  font-weight:800;
  font-size:12px
}

.source-btn:hover{
  opacity:.85
}

.note{
  font-size:11px;
  color:#888;
  line-height:1.7;
  margin:20px 3px
}

.empty{
  text-align:center;
  color:#888;
  padding:40px 10px
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <h1>🎤 HEROINES LIVE</h1>
    <div class="sub">北海道を最優先｜東京の生誕祭・ワンマンも掲載</div>
    <input id="q" placeholder="グループ・会場・公演名を検索">
  </div>
</header>

<main class="wrap">

<div class="filter-title">📍 エリア</div>

<div class="filters" id="areas">
  <button class="f on" data-f="all">すべて</button>
  <button class="f" data-f="hokkaido">📍北海道</button>
  <button class="f" data-f="sapporo">札幌</button>
  <button class="f" data-f="otaru">小樽</button>
  <button class="f" data-f="tokyo">東京</button>
</div>

<div class="filter-title">🎤 公演タイプ</div>

<div class="filters" id="types">
  <button class="f on" data-t="all">すべて</button>
  <button class="f" data-t="birthday">🎂 生誕祭</button>
  <button class="f" data-t="graduation">🎓 卒業</button>
  <button class="f" data-t="oneman">🎤 ワンマン</button>
  <button class="f" data-t="tour">🚌 ツアー</button>
  <button class="f" data-t="festival">🎪 主催・大型</button>
</div>

<div id="list"></div>

<div class="note">
公演情報は自動取得・更新されます。販売状況、出演者、会場、開催内容は変更される場合があります。購入前に公式販売ページをご確認ください。
</div>

</main>

<script>

let data=[];
let area='all';
let type='all';

const dow=['日','月','火','水','木','金','土'];

const q=document.getElementById('q');
const list=document.getElementById('list');


function match(e){

  const text=
    `${e.group||''} ${e.title||''} ${e.venue||''} ${e.area||''}`
    .toLowerCase();

  const types=
    Array.isArray(e.types)
      ? e.types
      : [e.type||'other'];

  let a=
    area==='all' ||
    (area==='hokkaido'&&(e.area||'').includes('北海道')) ||
    (area==='sapporo'&&(e.area||'').includes('札幌')) ||
    (area==='otaru'&&(e.area||'').includes('小樽')) ||
    (area==='tokyo'&&(e.area||'')==='東京');

  let t=
    type==='all' ||
    types.includes(type);

  return a && t &&
    text.includes(q.value.toLowerCase().trim());
}


function label(t){

  return ({
    birthday:'🎂 生誕祭',
    graduation:'🎓 卒業',
    oneman:'🎤 ワンマン',
    tour:'🚌 ツアー',
    festival:'🎪 主催・大型',
    other:'🎵 ライブ'
  })[t]||t;

}


/*
  情報源を整理する関数

  新しい形式：
  sources:[
    {name:"TicketDive",url:"https://..."},
    {name:"ローチケ",url:"https://..."}
  ]

  今までの形式：
  source:"TicketDive"
  url:"https://..."

  両方に対応しています。
*/

function getSources(e){

  if(Array.isArray(e.sources) && e.sources.length){

    return e.sources.filter(
      s=>s && s.url
    );

  }

  if(e.url){

    return [{
      name:e.source || 'チケット',
      url:e.url
    }];

  }

  return [];

}


function render(){

  let a=data
    .filter(match)
    .sort((x,y)=>x.date.localeCompare(y.date));

  let last='';

  if(!a.length){

    list.innerHTML=
      '<div class="empty">該当する公演はありません</div>';

    return;

  }


  list.innerHTML=a.map(e=>{

    const d=
      new Date(e.date+'T00:00:00');

    const m=
      e.date.slice(0,7);

    const h=
      m!==last
      ? `<div class="month">
           ${d.getFullYear()}年${d.getMonth()+1}月
         </div>`
      : '';

    last=m;


    const types=
      Array.isArray(e.types)
        ? e.types
        : [e.type||'other'];


    const sources=
      getSources(e);


    const sourceButtons=
      sources.length
      ? `
        <div class="sources">
          ${sources.map(s=>`
            <a
              class="source-btn"
              href="${s.url}"
              target="_blank"
              rel="noopener"
            >
              🔗 ${s.name}
            </a>
          `).join('')}
        </div>
      `
      : '';


    return `
      ${h}

      <article class="card">

        <div class="head">

          <div class="date">
            ${d.getMonth()+1}/${d.getDate()}
            <span class="dow">
              (${dow[d.getDay()]})
            </span>
          </div>

          <span class="badge ${e.status==='販売中'?'ok':''}">
            ${e.status||'要確認'}
          </span>

        </div>


        <div class="group">
          ${e.group||''}
        </div>


        <div class="title">
          ${e.title||''}
        </div>


        <div class="venue">
          📍 ${e.venue||''}　${e.area||''}
        </div>


        <div>
          ${types.map(t=>`
            <span class="tag">
              ${label(t)}
            </span>
          `).join('')}
        </div>


        ${sourceButtons}

      </article>
    `;

  }).join('');

}


document
  .querySelectorAll('#areas .f')
  .forEach(b=>{

    b.onclick=()=>{

      document
        .querySelectorAll('#areas .f')
        .forEach(x=>x.classList.remove('on'));

      b.classList.add('on');

      area=b.dataset.f;

      render();

    };

  });


document
  .querySelectorAll('#types .f')
  .forEach(b=>{

    b.onclick=()=>{

      document
        .querySelectorAll('#types .f')
        .forEach(x=>x.classList.remove('on'));

      b.classList.add('on');

      type=b.dataset.t;

      render();

    };

  });


q.oninput=render;


fetch('./events.json')
  .then(r=>r.json())
  .then(x=>{
    data=x;
    render();
  })
  .catch(()=>{
    list.innerHTML=
      '<div class="empty">イベントデータを読み込めませんでした</div>';
  });

</script>

<script>
if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js");
  });

}
</script>

</body>
</html>
