name: Update HEROINES LIVE

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect TicketDive events
        run: python scrape_ticketdive.py

      - name: Test Lawson connection
          run: |
            echo "=== DNS ==="
            getent ahosts l-tike.com || true
            echo "=== IPv4 ==="
            curl -4 -I --connect-timeout 10 --max-time 20 https://l-tike.com/ || true
            exit 1
      - name: Collect Lawson events
        run: python scrape_lawson.py

      - name: Merge events
        run: python merge_events.py

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json events_lawson.json
          git diff --cached --quiet || git commit -m "Update live events"
          git push
