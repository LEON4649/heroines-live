name: Lawson Proxy Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test AllOrigins
        run: |
          python - <<'PY'
          import requests
          import urllib.parse

          target = "https://l-tike.com/artist/000000000915501/"
          proxy = "https://api.allorigins.win/raw?url=" + urllib.parse.quote(target, safe="")

          print("Target:", target)
          print("Proxy:", proxy)

          r = requests.get(proxy, timeout=30)

          print("HTTP:", r.status_code)
          print("LENGTH:", len(r.text))
          print("CONTENT:")
          print(r.text[:1000])

          r.raise_for_status()
          PY
