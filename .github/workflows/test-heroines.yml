name: HEROINES Official Site Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test HEROINES official site
        run: |
          python - <<'PY'
          import requests

          urls = [
              "https://heroines.jp/",
              "https://heroines.jp/news/public/_/uqkm8rvzhnseedmq.html",
          ]

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          for url in urls:
              print()
              print("================================")
              print("TEST:", url)
              print("================================")

              try:
                  r = requests.get(
                      url,
                      headers=headers,
                      timeout=30
                  )

                  print("HTTP:", r.status_code)
                  print("LENGTH:", len(r.text))
                  print("OK")

                  r.raise_for_status()

              except Exception as e:
                  print("ERROR:", e)
                  raise

          print()
          print("HEROINES公式サイトへの接続テスト成功！")
          PY
